[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-builder"
version = "0.1.0"
description = "Static GeoJSON generation pipeline for the geo ecosystem"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "requests>=2.32",
    "truststore>=0.10; sys_platform == 'win32'",
    "pywebview>=5.0",
]

[project.scripts]
geo-builder = "geo_builder.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    ".",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"